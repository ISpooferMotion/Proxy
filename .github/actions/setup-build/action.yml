name: Set up ISpooferMotion build tools
description: Installs the pinned Rust and Bun toolchains plus supported desktop dependencies.
inputs:
  bun:
    description: Install Bun.
    default: "false"
  components:
    description: Rust components to install.
    default: ""
  desktop:
    description: Install Linux desktop build dependencies.
    default: "true"
  cache-key:
    description: Component-specific Rust cache key.
    required: true
  workspaces:
    description: Rust workspace path passed to rust-cache.
    default: source
  cache-directories:
    description: Additional directories to cache (e.g. protected-source/target).
    default: ""
runs:
  using: composite
  steps:
    - name: Install Linux desktop dependencies
      if: runner.os == 'Linux' && inputs.desktop == 'true'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install --yes \
          libwebkit2gtk-4.1-dev \
          libappindicator3-dev \
          librsvg2-dev \
          patchelf \
          libssl-dev \
          libsecret-1-dev
    - name: Install Rust
      uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
      with:
        toolchain: 1.98.1
        components: ${{ inputs.components }}
    - name: Restore Rust cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: ${{ inputs.workspaces }}
        key: ${{ inputs.cache-key }}
        cache-directories: ${{ inputs.cache-directories }}
        cache-on-failure: false
    - name: Install Bun
      if: inputs.bun == 'true'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.2

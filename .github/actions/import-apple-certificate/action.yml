name: Import Apple signing certificate
description: Imports a distribution certificate into an ephemeral keychain.
inputs:
  certificate-base64:
    description: Base64-encoded P12 certificate.
    required: true
  certificate-password:
    description: P12 password.
    required: true
outputs:
  keychain:
    description: Temporary signing keychain path.
    value: ${{ steps.import.outputs.keychain }}
runs:
  using: composite
  steps:
    - shell: bash
      env:
        APPLE_CERTIFICATE: ${{ inputs.certificate-base64 }}
        APPLE_CERTIFICATE_PASSWORD: ${{ inputs.certificate-password }}
      run: |
        set -euo pipefail
        test -n "$APPLE_CERTIFICATE"
        test -n "$APPLE_CERTIFICATE_PASSWORD"
        keychain="$RUNNER_TEMP/ispoofermotion-release-$(openssl rand -hex 12).keychain-db"
        certificate="$RUNNER_TEMP/ispoofermotion-release.p12"
        keychain_password="$(openssl rand -hex 32)"
        import_complete=false
        cleanup() {
          rm -f "$certificate"
          if [[ "$import_complete" != true ]]; then
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
          fi
        }
        trap cleanup EXIT
        printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
        security create-keychain -p "$keychain_password" "$keychain"
        security set-keychain-settings -lut 21600 "$keychain"
        security unlock-keychain -p "$keychain_password" "$keychain"
        security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -t cert -f pkcs12 -k "$keychain"
        security list-keychains -d user -s "$keychain" login.keychain-db
        security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
        echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
        import_complete=true

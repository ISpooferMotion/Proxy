name: ISpooferMotion Desktop Release
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: The 40-character commit SHA containing the Tauri desktop app
        type: string
        required: true
      release_tag:
        description: CalVer release tag, e.g. v3.2610.16
        type: string
        required: true
  workflow_call:
    inputs:
      source_sha: { type: string, required: true }
      release_tag: { type: string, required: true }
    secrets:
      PAT: { required: true }
      UPDATER_PRIVATE_KEY: { required: true }
      RELEASE_API_TOKEN: { required: true }
      RELEASE_API_BASE: { required: false }
      WINDOWS_CERTIFICATE_BASE64: { required: false }
      WINDOWS_CERTIFICATE_PASSWORD: { required: false }
      APPLE_CERTIFICATE: { required: false }
      APPLE_CERTIFICATE_PASSWORD: { required: false }
      APPLE_SIGNING_IDENTITY: { required: false }
      APPLE_ID: { required: false }
      APPLE_PASSWORD: { required: false }
      APPLE_TEAM_ID: { required: false }
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ inputs.release_tag }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ISpooferMotion/Proxy
          path: automation
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ISpooferMotion/ISpooferMotion-VeeThree
          ref: ${{ inputs.source_sha }}
          path: source
          token: ${{ secrets.PAT }}
          fetch-tags: true
          persist-credentials: false
      - id: version
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          version="$(node automation/scripts/verify-desktop-source.mjs source "$RELEASE_TAG" | sed -n 's/.*validated: //p')"
          test -n "$version"
          git -C source fetch --tags --force
          if git -C source rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null 2>&1; then
            test "$(git -C source rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$SOURCE_SHA"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
  build:
    needs: validate
    uses: ISpooferMotion/Proxy/.github/workflows/build.yml@main
    with:
      source_sha: ${{ inputs.source_sha }}
      version: ${{ needs.validate.outputs.version }}
    secrets: inherit
  publish:
    needs: [validate, build]
    runs-on: windows-latest
    environment: release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ISpooferMotion/Proxy
          path: automation
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-*
          path: installer-stage
          merge-multiple: true
      - name: Validate expected artifacts and generate checksums
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          node automation/scripts/verify-staged-installers.mjs installer-stage "$VERSION"
          (cd installer-stage && sha256sum ISpooferMotion-* > SHA256SUMS)
      - name: Publish GitHub release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          repo=ISpooferMotion/ISpooferMotion-VeeThree
          if gh release view "$RELEASE_TAG" --repo "$repo" --json isDraft >/tmp/release.json 2>/dev/null; then
            test "$(jq -r '.isDraft' /tmp/release.json)" = true
          else
            gh release create "$RELEASE_TAG" --repo "$repo" --target "$SOURCE_SHA" --title "ISpooferMotion $RELEASE_TAG" --generate-notes --draft
          fi
          gh release upload "$RELEASE_TAG" installer-stage/* --repo "$repo" --clobber
      - name: Publish release and verified update manifests
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          UPDATER_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
          RELEASE_API_TOKEN: ${{ secrets.RELEASE_API_TOKEN }}
          RELEASE_API_BASE: ${{ secrets.RELEASE_API_BASE }}
          VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          repo=ISpooferMotion/ISpooferMotion-VeeThree
          gh release edit "$RELEASE_TAG" --repo "$repo" --draft=false --latest
          if ! node automation/scripts/publish-runtime-updates.mjs installer-stage "$repo" "$RELEASE_TAG" "$VERSION"; then
            gh release edit "$RELEASE_TAG" --repo "$repo" --draft=true
            exit 1
          fi

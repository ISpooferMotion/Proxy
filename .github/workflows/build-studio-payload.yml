name: Build Studio Payload

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
    secrets:
      ISM_HWID_SALT: { required: false }
      WINDOWS_CERTIFICATE_BASE64: { required: false }
      WINDOWS_CERTIFICATE_PASSWORD: { required: false }

permissions:
  contents: read

jobs:
  build:
    name: Studio payload (windows-x86_64)
    runs-on: windows-latest
    environment: release
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ISpooferMotion/Proxy
          path: automation
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: ./automation/.github/actions/setup-build
        with:
          cache-key: studio-payload-windows-x86_64
          desktop: "false"
      - id: signing
        uses: ./automation/.github/actions/import-windows-certificate
        with:
          certificate-base64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          certificate-password: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - name: Build Studio payload
        working-directory: source
        env:
          ISM_HWID_SALT: ${{ secrets.ISM_HWID_SALT }}
        run: cargo build --locked --release -p ism-studio-payload
      - name: Sign and verify Studio payload
        shell: pwsh
        working-directory: source
        env:
          SIGNTOOL: ${{ steps.signing.outputs.signtool }}
          THUMBPRINT: ${{ steps.signing.outputs.thumbprint }}
        run: |
          & $env:SIGNTOOL sign /sha1 $env:THUMBPRINT /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 target/release/ism_studio_payload.dll
          if ($LASTEXITCODE -ne 0) { throw "Studio payload signing failed" }
          & $env:SIGNTOOL verify /pa /all /v target/release/ism_studio_payload.dll
          if ($LASTEXITCODE -ne 0) { throw "Studio payload signature verification failed" }
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: source/target/release/ism_studio_payload.dll
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: component-studio-payload-windows-x86_64
          path: source/target/release/ism_studio_payload.dll
          if-no-files-found: error
          retention-days: 7

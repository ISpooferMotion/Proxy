name: Build Loader

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      test_build:
        description: Compile an offline test build that never installs production runtime updates
        type: boolean
        required: false
        default: false
      create_deployment:
        description: Create GitHub deployment events for release builds; set false for downloadable test builds
        type: boolean
        required: false
        default: true
      version:
        type: string
        required: true
    secrets:
      PAT: { required: true }
      ISM_HWID_SALT: { required: false }
      WINDOWS_CERTIFICATE_BASE64: { required: false }
      WINDOWS_CERTIFICATE_PASSWORD: { required: false }
      APPLE_CERTIFICATE: { required: false }
      APPLE_CERTIFICATE_PASSWORD: { required: false }
      APPLE_SIGNING_IDENTITY: { required: false }
      APPLE_ID: { required: false }
      APPLE_PASSWORD: { required: false }
      APPLE_TEAM_ID: { required: false }
      TAURI_PRIVATE_KEY: { required: false }
      TAURI_PRIVATE_KEY_PASSWORD: { required: false }
      TAURI_PUBLIC_KEY: { required: false }
      UPDATER_PRIVATE_KEY: { required: false }

permissions:
  contents: read

jobs:
  build:
    name: Loader (${{ matrix.label }})
    env:
      ISM_PACKAGED_TEST_BUILD: ${{ inputs.test_build && '1' || '0' }}
      WINDOWS_SIGNING_ENABLED: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
      APPLE_SIGNING_ENABLED: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' }}
      APPLE_NOTARIZATION_ENABLED: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            label: windows-x86_64
            bundles: nsis
          - runner: macos-15-intel
            label: macos-x86_64
            bundles: app,dmg
          - runner: macos-15
            label: macos-aarch64
            bundles: app,dmg
    runs-on: ${{ matrix.runner }}
    environment:
      name: release
      deployment: ${{ inputs.create_deployment }}
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout automation scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ISpooferMotion/Proxy
          path: automation
          persist-credentials: false
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ISpooferMotion/ISpooferMotion-VeeThree
          ref: ${{ inputs.source_sha }}
          path: source
          token: ${{ secrets.PAT }}
          persist-credentials: false
      - uses: ./automation/.github/actions/setup-build
        with:
          bun: "true"
          cache-key: protected-loader-${{ matrix.label }}
          cache-directories: protected-source/target
          desktop: "true"
      - name: Install dependencies
        shell: bash
        working-directory: source
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Obfuscate source
        shell: bash
        working-directory: source
        env:
          ISM_HWID_SALT: ${{ secrets.ISM_HWID_SALT }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ -d "$GITHUB_WORKSPACE/protected-source/target" ]]; then
            mkdir -p "$RUNNER_TEMP/ism-cache"
            mv "$GITHUB_WORKSPACE/protected-source/target" "$RUNNER_TEMP/ism-cache/target"
          fi
          seed=$((16#${SOURCE_SHA:0:15}))
          bun run scripts/obfuscate.ts \
            --profile hardened \
            --seed "$seed" \
            --target "$GITHUB_WORKSPACE/protected-source" \
            --ts \
            --no-verify
          if [[ -d "$RUNNER_TEMP/ism-cache/target" ]]; then
            mv "$RUNNER_TEMP/ism-cache/target" "$GITHUB_WORKSPACE/protected-source/target"
          fi
          test -f "$GITHUB_WORKSPACE/protected-source/Cargo.toml"
          test -f "$GITHUB_WORKSPACE/protected-source/apps/loader/src-tauri/Cargo.toml"
      - name: Install protected dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd protected-source
          bun install --frozen-lockfile --ignore-scripts
          cd apps/loader
          bun install --frozen-lockfile --ignore-scripts
      - id: windows-signing
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_ENABLED == 'true'
        uses: ./automation/.github/actions/import-windows-certificate
        with:
          certificate-base64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          certificate-password: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - if: runner.os == 'macOS' && env.APPLE_SIGNING_ENABLED == 'true'
        uses: ./automation/.github/actions/import-apple-certificate
        with:
          certificate-base64: ${{ secrets.APPLE_CERTIFICATE }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Configure Tauri release
        shell: bash
        env:
          RUNNER_PLATFORM: ${{ runner.os }}
          TAURI_PUBLIC_KEY: ${{ secrets.TAURI_PUBLIC_KEY }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ steps.windows-signing.outputs.thumbprint }}
        run: |
          set -euo pipefail
          test -n "$TAURI_PUBLIC_KEY"
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const config = {
            plugins: {
              updater: {
                pubkey: process.env.TAURI_PUBLIC_KEY,
                endpoints: [
                  "https://ispoofermotion.com/api/v3/updates/loader?os={{target}}&arch={{arch}}"
                ],
                windows: { installMode: "passive" }
              }
            },
            bundle: {
              createUpdaterArtifacts: true
            }
          };
          if (
            process.env.RUNNER_PLATFORM === "Windows" &&
            process.env.WINDOWS_CERTIFICATE_THUMBPRINT
          ) {
            config.bundle.windows = {
              certificateThumbprint: process.env.WINDOWS_CERTIFICATE_THUMBPRINT,
              digestAlgorithm: "sha256",
              timestampUrl: "http://timestamp.digicert.com"
            };
          }
          writeFileSync(
            "protected-source/apps/loader/src-tauri/tauri.release.conf.json",
            `${JSON.stringify(config, null, 2)}\n`
          );
          NODE
      - name: Build Loader
        working-directory: protected-source/apps/loader
        shell: bash
        env:
          ISM_HWID_SALT: ${{ secrets.ISM_HWID_SALT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_PRIVATE_KEY_PASSWORD }}
          RAW_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          RAW_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          RAW_APPLE_ID: ${{ secrets.APPLE_ID }}
          RAW_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          RAW_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/protected-source/target/release/bundle"
          if [[ -n "${RAW_APPLE_CERTIFICATE:-}" && -n "${RAW_APPLE_SIGNING_IDENTITY:-}" ]]; then
            export APPLE_SIGNING_IDENTITY="$RAW_APPLE_SIGNING_IDENTITY"
          else
            unset APPLE_SIGNING_IDENTITY
          fi
          if [[ -n "${RAW_APPLE_CERTIFICATE:-}" && -n "${RAW_APPLE_ID:-}" && -n "${RAW_APPLE_PASSWORD:-}" && -n "${RAW_APPLE_TEAM_ID:-}" ]]; then
            export APPLE_ID="$RAW_APPLE_ID"
            export APPLE_PASSWORD="$RAW_APPLE_PASSWORD"
            export APPLE_TEAM_ID="$RAW_APPLE_TEAM_ID"
          else
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          bun x tauri build --ci --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }}
      - name: Stage Windows Loader artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          SIGNTOOL: ${{ steps.windows-signing.outputs.signtool }}
          UPDATER_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
        run: |
          $bundle = 'protected-source/target/release/bundle/nsis'
          $installer = @(Get-ChildItem -LiteralPath $bundle -File -Filter "*$env:VERSION*.exe")
          if ($installer.Count -eq 0) {
            $installer = @(Get-ChildItem -LiteralPath $bundle -File -Filter '*.exe')
          }
          if ($installer.Count -ne 1) {
            $found = ($installer | ForEach-Object { $_.FullName }) -join ', '
            throw "Expected exactly one NSIS installer for version $env:VERSION, found $($installer.Count): $found"
          }
          $signature = "$($installer[0].FullName).sig"
          if (-not (Test-Path -LiteralPath $signature)) {
            node automation/scripts/sign-tauri-artifact.mjs $installer[0].FullName $signature
          }
          if (-not (Test-Path -LiteralPath $signature)) { throw "NSIS updater signature is missing" }
          if (-not [string]::IsNullOrWhiteSpace($env:SIGNTOOL)) {
            & $env:SIGNTOOL verify /pa /all /v $installer[0].FullName
            if ($LASTEXITCODE -ne 0) { throw "NSIS Authenticode verification failed" }
            & $env:SIGNTOOL verify /pa /all /v 'protected-source/target/release/ISpooferMotion.exe'
            if ($LASTEXITCODE -ne 0) { throw "Loader Authenticode verification failed" }
          }
          New-Item -ItemType Directory -Path loader-stage -Force | Out-Null
          $name = "ISpooferMotion-Loader-$env:VERSION-windows-x86_64-setup.exe"
          Copy-Item -LiteralPath $installer[0].FullName -Destination "loader-stage/$name"
          Copy-Item -LiteralPath $signature -Destination "loader-stage/$name.sig"
          # Offline test packages need the signed loader binary, not just the NSIS installer.
          if ($env:ISM_PACKAGED_TEST_BUILD -eq '1') {
            $portableName = "ISpooferMotion-Loader-$env:VERSION-windows-x86_64.exe"
            Copy-Item -LiteralPath 'protected-source/target/release/ISpooferMotion.exe' -Destination "loader-stage/$portableName"
          }
      - name: Stage macOS Loader artifacts
        if: runner.os == 'macOS'
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          LABEL: ${{ matrix.label }}
          UPDATER_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(protected-source/target/release/bundle/macos/*.app)
          dmgs=(protected-source/target/release/bundle/dmg/*"${VERSION}"*.dmg)
          if [[ ${#dmgs[@]} -eq 0 ]]; then
            dmgs=(protected-source/target/release/bundle/dmg/*.dmg)
          fi
          updates=(protected-source/target/release/bundle/macos/*"${VERSION}"*.app.tar.gz)
          if [[ ${#updates[@]} -eq 0 ]]; then
            updates=(protected-source/target/release/bundle/macos/*.app.tar.gz)
          fi
          [[ ${#apps[@]} -eq 1 && ${#dmgs[@]} -eq 1 && ${#updates[@]} -eq 1 ]]
          if [[ ! -f "${updates[0]}.sig" ]]; then
            node automation/scripts/sign-tauri-artifact.mjs "${updates[0]}" "${updates[0]}.sig"
          fi
          test -f "${updates[0]}.sig"
          if [[ "$APPLE_SIGNING_ENABLED" == "true" ]]; then
            codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          fi
          if [[ "$APPLE_NOTARIZATION_ENABLED" == "true" ]]; then
            spctl --assess --type execute --verbose=2 "${apps[0]}"
            xcrun stapler validate "${dmgs[0]}"
          fi
          mkdir -p loader-stage
          cp "${dmgs[0]}" "loader-stage/ISpooferMotion-Loader-${VERSION}-${LABEL}.dmg"
          cp "${updates[0]}" "loader-stage/ISpooferMotion-Loader-${VERSION}-${LABEL}.app.tar.gz"
          cp "${updates[0]}.sig" "loader-stage/ISpooferMotion-Loader-${VERSION}-${LABEL}.app.tar.gz.sig"
      - name: Verify Tauri updater signature
        shell: bash
        env:
          TAURI_PUBLIC_KEY: ${{ secrets.TAURI_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          artifact="$(find loader-stage -maxdepth 1 -type f ! -name '*.sig' ! -name '*.dmg' | head -n 1)"
          test -n "$artifact"
          test -f "${artifact}.sig"
          node automation/scripts/verify-tauri-signature.mjs "$artifact" "${artifact}.sig"
      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ./loader-stage
          format: cyclonedx-json
          output-file: ./loader-stage/ISpooferMotion-Loader-${{ inputs.version }}-${{ matrix.label }}.sbom.cdx.json
          upload-artifact: false
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: loader-stage/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: loader-${{ matrix.label }}
          path: loader-stage/*
          if-no-files-found: error
          retention-days: 1

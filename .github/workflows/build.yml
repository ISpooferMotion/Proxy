name: Proxy Builder

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hub-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout ISpooferMotion-Hub metadata
        uses: actions/checkout@v4
        with:
          repository: ISpooferMotion/ISpooferMotion-Hub
          token: ${{ secrets.PAT }}
          path: ISpooferMotion-Hub

      - name: Resolve next Hub version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          RELEASE_REPOSITORY: ISpooferMotion/ISpooferMotion-Hub
        run: |
          set -euo pipefail

          source_version="$(jq -er '.version' ISpooferMotion-Hub/tauri.conf.json)"
          if [[ ! "$source_version" =~ ^1\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Hub baseline version: $source_version" >&2
            exit 1
          fi

          latest_version="$({
            gh api --paginate "repos/${RELEASE_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.draft == false) | .tag_name' |
              sed -nE 's/^v(1\.[0-9]+\.[0-9]+)$/\1/p' |
              sort -V |
              tail -n 1
          })"

          version="$source_version"
          if [[ -n "$latest_version" ]]; then
            IFS=. read -r major minor patch <<<"$latest_version"
            if (( patch >= 99 )); then
              next_version="${major}.$((minor + 1)).0"
            else
              next_version="${major}.${minor}.$((patch + 1))"
            fi

            version="$(printf '%s\n%s\n' "$source_version" "$next_version" | sort -V | tail -n 1)"
          fi

          release_tag="v${version}"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Persist generated Hub version
        shell: pwsh
        env:
          HUB_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $utf8 = [System.Text.UTF8Encoding]::new($false)

          function Set-FirstVersion([string] $path, [string] $pattern) {
            $resolved = (Resolve-Path -LiteralPath $path).Path
            $content = [System.IO.File]::ReadAllText($resolved)
            $regex = [System.Text.RegularExpressions.Regex]::new($pattern)
            if (-not $regex.IsMatch($content)) {
              throw "Could not find the version field in $path"
            }
            $replacement = '${1}' + $env:HUB_VERSION + '${2}'
            $updated = $regex.Replace($content, $replacement, 1)
            [System.IO.File]::WriteAllText($resolved, $updated, $utf8)
          }

          Set-FirstVersion 'ISpooferMotion-Hub/tauri.conf.json' '("version"\s*:\s*")[^"]+(")'
          Set-FirstVersion 'ISpooferMotion-Hub/package.json' '("version"\s*:\s*")[^"]+(")'
          Set-FirstVersion 'ISpooferMotion-Hub/Cargo.toml' '(?ms)(^\[package\]\r?\n.*?^version\s*=\s*")[^"]+(")'
          Set-FirstVersion 'ISpooferMotion-Hub/Cargo.lock' '(?m)(^\[\[package\]\]\r?\nname = "hub"\r?\nversion = ")[^"]+(")'

      - name: Commit generated Hub version
        id: source
        shell: bash
        env:
          HUB_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          if ! git -C ISpooferMotion-Hub diff --quiet; then
            git -C ISpooferMotion-Hub config user.name "github-actions[bot]"
            git -C ISpooferMotion-Hub config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C ISpooferMotion-Hub add Cargo.toml Cargo.lock package.json tauri.conf.json
            git -C ISpooferMotion-Hub commit -m "chore: bump Hub version to ${HUB_VERSION}"
            git -C ISpooferMotion-Hub push origin HEAD:master
          fi

          source_sha="$(git -C ISpooferMotion-Hub rev-parse HEAD)"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Prepare a clean Hub release draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          RELEASE_REPOSITORY: ISpooferMotion/ISpooferMotion-Hub
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          release_tag="$RELEASE_TAG"
          if release_json="$(gh release view "$release_tag" --repo "$RELEASE_REPOSITORY" --json isDraft 2>/dev/null)"; then
            if [[ "$(jq -r '.isDraft' <<<"$release_json")" != "true" ]]; then
              echo "Hub version $VERSION is already published." >&2
              exit 1
            fi

            gh release view "$release_tag" --repo "$RELEASE_REPOSITORY" --json assets --jq '.assets[].name' |
              while IFS= read -r asset; do
                [[ -z "$asset" ]] || gh release delete-asset "$release_tag" "$asset" --repo "$RELEASE_REPOSITORY" --yes
              done
          else
            gh release create "$release_tag" \
              --repo "$RELEASE_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "ISpooferMotion Hub $release_tag" \
              --generate-notes \
              --draft
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin --bundles app,dmg"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin --bundles app,dmg"
          - platform: ubuntu-22.04
            args: "--bundles appimage"
          - platform: windows-latest
            args: "--bundles nsis"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout ISpooferMotion-Hub
        uses: actions/checkout@v4
        with:
          repository: ISpooferMotion/ISpooferMotion-Hub
          token: ${{ secrets.PAT }}
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: ISpooferMotion-Hub

      - name: Checkout ISpooferMotion-V3
        uses: actions/checkout@v4
        with:
          repository: ISpooferMotion/ISpooferMotion-VeeThree
          token: ${{ secrets.PAT }}
          path: ISpooferMotion-V3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Obfuscate Hub Source
        shell: bash
        run: |
          set -euo pipefail
          mv ISpooferMotion-Hub ISpooferMotion-Hub-Orig
          cargo run --manifest-path ISpooferMotion-V3/apps/obfuscator/Cargo.toml --release -- --source ./ISpooferMotion-Hub-Orig --target ./ISpooferMotion-Hub --verify

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile --ignore-scripts
        working-directory: ISpooferMotion-Hub/ui

      - name: Install core dependencies
        run: bun install --frozen-lockfile --ignore-scripts
        working-directory: ISpooferMotion-Hub

      - name: Build and upload signed Tauri bundles
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
          ISM_HWID_SALT: ${{ secrets.ISM_HWID_SALT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
        with:
          projectPath: ISpooferMotion-Hub
          tauriScript: bun tauri
          owner: ISpooferMotion
          repo: ISpooferMotion-Hub
          tagName: ${{ needs.prepare.outputs.release_tag }}
          releaseName: ISpooferMotion Hub ${{ needs.prepare.outputs.release_tag }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadPlainBinary: false
          assetNamePattern: ISpooferMotion-[version]-[platform]-[arch][setup][ext]
          args: ${{ matrix.args }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Validate release assets and updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_REPOSITORY: ISpooferMotion/ISpooferMotion-Hub
        run: |
          set -euo pipefail

          mkdir release-check
          gh release download "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --pattern latest.json --dir release-check
          gh release view "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --json assets --jq '.assets[].name' > release-check/assets.txt

          if grep -Eiq 'build[_-]script[_-]build' release-check/assets.txt; then
            echo "Cargo build-script executables must never be release assets." >&2
            exit 1
          fi

          for platform in windows-x86_64 darwin-x86_64 darwin-aarch64 linux-x86_64; do
            if ! jq -e --arg platform "$platform" '
              .platforms[$platform]
              | (.signature | type == "string" and length > 0)
                and (.url | type == "string" and startswith("https://github.com/ISpooferMotion/ISpooferMotion-Hub/releases/download/"))
            ' release-check/latest.json > /dev/null; then
              echo "latest.json is missing a signed updater entry for $platform." >&2
              exit 1
            fi
          done

          require_asset() {
            local pattern="$1"
            local description="$2"
            if ! grep -Eiq "$pattern" release-check/assets.txt; then
              echo "Release is missing the $description asset." >&2
              exit 1
            fi
          }

          require_asset 'windows.*(x86_64|x64|amd64).*\.exe$' 'Windows x64 installer'
          require_asset '(darwin|macos).*(x86_64|x64|amd64).*\.dmg$' 'macOS Intel DMG'
          require_asset '(darwin|macos).*(aarch64|arm64).*\.dmg$' 'macOS Apple Silicon DMG'
          require_asset 'linux.*(x86_64|x64|amd64).*\.AppImage$' 'Linux x64 AppImage'

      - name: Publish completed Hub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_REPOSITORY: ISpooferMotion/ISpooferMotion-Hub
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --draft=false --latest

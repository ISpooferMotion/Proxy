name: Build desktop installers
on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      version:
        type: string
        required: true
    secrets:
      PAT: { required: true }
      WINDOWS_CERTIFICATE_BASE64: { required: false }
      WINDOWS_CERTIFICATE_PASSWORD: { required: false }
      APPLE_CERTIFICATE: { required: false }
      APPLE_CERTIFICATE_PASSWORD: { required: false }
      APPLE_SIGNING_IDENTITY: { required: false }
      APPLE_ID: { required: false }
      APPLE_PASSWORD: { required: false }
      APPLE_TEAM_ID: { required: false }
permissions:
  contents: read
jobs:
  build:
    name: Installer (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            label: windows-x86_64
            bundles: nsis
            bundle_directory: nsis
          - runner: macos-15-intel
            label: macos-x86_64
            bundles: dmg
            bundle_directory: dmg
          - runner: macos-15
            label: macos-aarch64
            bundles: dmg
            bundle_directory: dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ISpooferMotion/Proxy
          path: automation
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ISpooferMotion/ISpooferMotion-VeeThree
          ref: ${{ inputs.source_sha }}
          path: source
          token: ${{ secrets.PAT }}
          persist-credentials: false
      - uses: ./automation/.github/actions/setup-build
        with:
          bun: "true"
          cache-key: desktop-release-${{ matrix.label }}
          workspaces: |
            source/src-tauri
            source/apps/mcp-server
      - name: Validate desktop source
        shell: bash
        run: node automation/scripts/verify-desktop-source.mjs source "v${{ inputs.version }}"
      - name: Install frontend dependencies
        working-directory: source
        shell: bash
        run: bun install --frozen-lockfile --ignore-scripts
      - id: windows-signing
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_ENABLED == 'true'
        uses: ./automation/.github/actions/import-windows-certificate
        with:
          certificate-base64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          certificate-password: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - if: runner.os == 'macOS' && env.APPLE_SIGNING_ENABLED == 'true'
        uses: ./automation/.github/actions/import-apple-certificate
        with:
          certificate-base64: ${{ secrets.APPLE_CERTIFICATE }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Configure Windows code-signing if available
        if: runner.os == 'Windows' && steps.windows-signing.outputs.thumbprint != ''
        shell: bash
        env:
          SIGNING_THUMBPRINT: ${{ steps.windows-signing.outputs.thumbprint }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync("source/src-tauri/tauri.signing.conf.json", JSON.stringify({bundle:{windows:{certificateThumbprint:process.env.SIGNING_THUMBPRINT,digestAlgorithm:"sha256",timestampUrl:"http://timestamp.digicert.com"}}}))'
      - name: Build the unmodified desktop app
        working-directory: source
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_SIGNING_IDENTITY:-}" ]]; then unset APPLE_SIGNING_IDENTITY; fi
          if [[ -z "${APPLE_ID:-}" || -z "${APPLE_PASSWORD:-}" || -z "${APPLE_TEAM_ID:-}" ]]; then
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          if [[ -f src-tauri/tauri.signing.conf.json ]]; then
            bun x tauri build --ci --config src-tauri/tauri.signing.conf.json --bundles "${{ matrix.bundles }}"
          else
            bun x tauri build --ci --bundles "${{ matrix.bundles }}"
          fi
      - name: Stage desktop installer
        shell: bash
        run: node automation/scripts/stage-desktop-installer.mjs "source/src-tauri/target/release/bundle/${{ matrix.bundle_directory }}" installer-stage "${{ inputs.version }}" "${{ matrix.label }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.label }}
          path: installer-stage/*
          if-no-files-found: error
          retention-days: 7
    env:
      WINDOWS_SIGNING_ENABLED: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
      APPLE_SIGNING_ENABLED: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY != '' }}

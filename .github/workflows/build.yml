name: Cross-Platform Proxy Builder

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to build (e.g., v1.0.0)'
        required: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin --bundles dmg'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin --bundles dmg'
          - platform: 'ubuntu-22.04'
            args: '--bundles appimage'
          - platform: 'windows-latest'
            args: '--bundles nsis'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout ISpooferMotion-Hub
        uses: actions/checkout@v4
        with:
          repository: ISpooferMotion/ISpooferMotion-Hub
          token: ${{ secrets.PAT }}
          ref: ${{ github.event.inputs.tag_name }}
          path: ISpooferMotion-Hub

      - name: Checkout ISpooferMotion-V3
        uses: actions/checkout@v4
        with:
          repository: ISpooferMotion/ISpooferMotion-VeeThree
          token: ${{ secrets.PAT }}
          path: ISpooferMotion-V3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Obfuscate Hub Source
        shell: bash
        run: |
          mv ISpooferMotion-Hub ISpooferMotion-Hub-Orig
          cargo run --manifest-path ISpooferMotion-V3/apps/obfuscator/Cargo.toml --release -- --source ./ISpooferMotion-Hub-Orig --target ./ISpooferMotion-Hub

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile --ignore-scripts
        working-directory: ISpooferMotion-Hub/ui

      - name: Install core dependencies
        run: bun install --frozen-lockfile --ignore-scripts
        working-directory: ISpooferMotion-Hub

      - name: Build Tauri App
        shell: bash
        env:
          ISM_HWID_SALT: ${{ secrets.ISM_HWID_SALT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
        run: |
          bunx tauri build ${{ matrix.args }}
        working-directory: ISpooferMotion-Hub

      - name: Upload to Private Repo Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          # Create a draft release on your private repo if it doesn't already exist
          gh release create "${{ github.event.inputs.tag_name }}" --repo ISpooferMotion/ISpooferMotion-Hub --title "ISpooferMotion Hub ${{ github.event.inputs.tag_name }}" --draft || true
          
          # Upload all generated bundles and updater signatures back to your private repo!
          find ISpooferMotion-Hub/src-tauri/target -type f \( -name "*.dmg" -o -name "*.AppImage" -o -name "*.exe" -o -name "*.msi" -o -name "*.zip" -o -name "*.tar.gz" -o -name "*.sig" \) -exec gh release upload "${{ github.event.inputs.tag_name }}" {} --repo ISpooferMotion/ISpooferMotion-Hub --clobber \;

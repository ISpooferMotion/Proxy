name: Build desktop installers
on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      version:
        type: string
        required: true
    secrets:
      PAT: { required: true }
permissions:
  contents: read
jobs:
  build:
    name: Installer (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            label: windows-x86_64
            bundles: nsis
            bundle_directory: nsis
          - runner: macos-15-intel
            label: macos-x86_64
            bundles: dmg
            bundle_directory: dmg
          - runner: macos-15
            label: macos-aarch64
            bundles: dmg
            bundle_directory: dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ISpooferMotion/Proxy
          ref: ${{ job.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ISpooferMotion/ISpooferMotion-VeeThree
          ref: ${{ inputs.source_sha }}
          path: source
          token: ${{ secrets.PAT }}
          persist-credentials: false
      - uses: ./automation/.github/actions/setup-build
        with:
          bun: "true"
          cache-key: desktop-release-${{ matrix.label }}
          workspaces: |
            source/apps/desktop/src-tauri
            source/apps/mcp-server
      - name: Validate desktop source
        shell: bash
        run: node automation/scripts/verify-desktop-source.mjs source "v${{ inputs.version }}"
      - name: Install frontend dependencies
        working-directory: source
        shell: bash
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build the unmodified desktop app
        working-directory: source/apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          bun x tauri build --ci --bundles "${{ matrix.bundles }}"
      - name: Stage desktop installer
        shell: bash
        run: node automation/scripts/stage-desktop-installer.mjs "source/apps/desktop/src-tauri/target/release/bundle/${{ matrix.bundle_directory }}" installer-stage "${{ inputs.version }}" "${{ matrix.label }}"
      - name: Stage macOS app bundle for isolated signing
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="source/apps/desktop/src-tauri/target/release/bundle/macos/ISpooferMotion.app"
          test -d "$app"
          mkdir -p app-stage
          ditto -c -k --sequesterRsrc --keepParent "$app" app-stage/ISpooferMotion.app.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-desktop-${{ matrix.label }}
          path: installer-stage/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: runner.os == 'macOS'
        with:
          name: unsigned-app-${{ matrix.label }}
          path: app-stage/ISpooferMotion.app.zip
          if-no-files-found: error
          retention-days: 7

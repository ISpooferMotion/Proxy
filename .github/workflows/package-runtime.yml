name: Package Runtime Updates

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true

permissions:
  contents: read

jobs:
  package:
    name: Runtime archive (${{ matrix.label }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - label: windows-x86_64
            platform: Windows
            executable_suffix: .exe
          - label: macos-x86_64
            platform: macOS
            executable_suffix: ""
          - label: macos-aarch64
            platform: macOS
            executable_suffix: ""
          - label: linux-x86_64
            platform: Linux
            executable_suffix: ""
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - working-directory: source
        run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: component-daemon-${{ matrix.label }}
          path: components/daemon
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: component-ui-${{ matrix.label }}
          path: components/ui
      - if: matrix.label == 'windows-x86_64'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: component-studio-payload-windows-x86_64
          path: components/studio
      - name: Stage exact runtime contract
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          SUFFIX: ${{ matrix.executable_suffix }}
        run: |
          set -euo pipefail
          mkdir stage
          cp "components/daemon/daemon${SUFFIX}" "stage/daemon${SUFFIX}"
          cp "components/ui/ui${SUFFIX}" "stage/ui${SUFFIX}"
          if [[ "$LABEL" == "windows-x86_64" ]]; then
            cp components/studio/ism_studio_payload.dll stage/ism_studio_payload.dll
          else
            chmod 755 stage/daemon stage/ui
          fi
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ./stage
          format: cyclonedx-json
          output-file: ./ISpooferMotion-${{ matrix.label }}.sbom.cdx.json
          upload-artifact: false
      - name: Package and validate runtime archive
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          archive="ISpooferMotion-${LABEL}.zip"
          bun run source/scripts/release/package-release-archive.ts stage "$archive" --platform "$PLATFORM"
          bun run source/scripts/release/validate-release-archive.ts "$archive" --platform "$PLATFORM"
          digest="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          printf '%s  %s\n' "$digest" "$archive" > "${archive}.sha256"
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: ISpooferMotion-${{ matrix.label }}.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-${{ matrix.label }}
          path: |
            ISpooferMotion-${{ matrix.label }}.zip
            ISpooferMotion-${{ matrix.label }}.zip.sha256
            ISpooferMotion-${{ matrix.label }}.sbom.cdx.json
          if-no-files-found: error
          retention-days: 7

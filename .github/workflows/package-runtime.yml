name: Package Runtime Updates

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
    secrets:
      PAT: { required: true }

permissions:
  contents: read

jobs:
  package:
    name: Runtime archive (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x86_64
            platform: Windows
            executable_suffix: .exe
          - label: macos-x86_64
            platform: macOS
            executable_suffix: ""
          - label: macos-aarch64
            platform: macOS
            executable_suffix: ""
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ISpooferMotion/ISpooferMotion-VeeThree
          ref: ${{ inputs.source_sha }}
          path: source
          token: ${{ secrets.PAT }}
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        working-directory: source
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Download daemon artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: component-daemon-${{ matrix.label }}
          path: components/daemon
      - name: Download UI artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: component-ui-${{ matrix.label }}
          path: components/ui
      - name: Download Windows Studio payload
        if: matrix.label == 'windows-x86_64'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: component-studio-payload-windows-x86_64
          path: components/studio
      - name: Download macOS Studio payload
        if: matrix.platform == 'macOS'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: component-studio-payload-macos-universal
          path: components/studio
      - name: Download MCP Server artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: component-mcp-server-${{ matrix.label }}
          path: components/mcp-server
      - name: Stage runtime components
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          SUFFIX: ${{ matrix.executable_suffix }}
        run: |
          set -euo pipefail
          mkdir stage
          cp "components/daemon/daemon${SUFFIX}" "stage/daemon${SUFFIX}"
          cp "components/ui/ui${SUFFIX}" "stage/ui${SUFFIX}"
          cp "components/mcp-server/mcp-server${SUFFIX}" "stage/mcp-server${SUFFIX}"
          if [[ "$LABEL" == "windows-x86_64" ]]; then
            cp components/studio/ISpooferMotion.dll stage/ISpooferMotion.dll
          else
            cp components/studio/libISpooferMotion.dylib stage/libISpooferMotion.dylib
            chmod 755 stage/daemon stage/ui stage/mcp-server stage/libISpooferMotion.dylib
          fi
      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ./stage
          format: cyclonedx-json
          output-file: ./ISpooferMotion-${{ matrix.label }}.sbom.cdx.json
          upload-artifact: false
      - name: Create release archive
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          archive="ISpooferMotion-${LABEL}.zip"
          bun run source/scripts/release/package-release-archive.ts stage "$archive" --platform "$PLATFORM"
          bun run source/scripts/release/validate-release-archive.ts "$archive" --platform "$PLATFORM"
          digest="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          printf '%s  %s\n' "$digest" "$archive" > "${archive}.sha256"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ISpooferMotion-${{ matrix.label }}.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-${{ matrix.label }}
          path: |
            ISpooferMotion-${{ matrix.label }}.zip
            ISpooferMotion-${{ matrix.label }}.zip.sha256
            ISpooferMotion-${{ matrix.label }}.sbom.cdx.json
          if-no-files-found: error
          retention-days: 1
